name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v$(tr -d '\r\n' < VERSION)"
          test "${GITHUB_REF_NAME}" = "${expected_tag}"
          git fetch origin main --depth=1
          test "${GITHUB_SHA}" = "$(git rev-parse origin/main)"
          grep -Fqx "## $(cat VERSION)" CHANGELOG.md
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.18.1
          args: check
      - name: Run release gates
        run: make release-check
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import-gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Verify Registry-compatible signing key
        shell: bash
        env:
          GPG_FINGERPRINT: ${{ steps.import-gpg.outputs.fingerprint }}
        run: |
          set -euo pipefail
          algorithm="$(gpg --batch --with-colons --list-keys "${GPG_FINGERPRINT}" | awk -F: '$1 == "pub" { print $4; exit }')"
          case "${algorithm}" in
            1|2|3|17) ;;
            *) echo "Terraform Registry provider signing requires an RSA or DSA primary key" >&2; exit 1 ;;
          esac
      - name: Publish signed release
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import-gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
